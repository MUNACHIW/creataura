{% extends "creataura/auth_base.html" %}
{% block title %}Forgot Password{% endblock %}
{% block heading %}Forgot password{% endblock %}
{% block subheading %}Enter your email and we'll send a reset link{% endblock %}
{% block content %}
<form method="post" class="auth-form">
    {% csrf_token %}
    <div class="auth-fields login-fields">
        <label>E-mail<input type="email" name="email" placeholder="Your e-mail" required></label>
    </div>
    <div class="auth-links"><a href="{% url 'login' %}">Back to Login</a><a href="{% url 'register' %}">Register Now</a>
    </div>
    <button type="submit" class="auth-submit">Send Reset Link</button>
</form>
{% endblock %}
